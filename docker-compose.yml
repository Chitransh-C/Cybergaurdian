services:
  mysql:
    image: mysql:8.4
    container_name: cyberguardian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cyberguardian}
      MYSQL_DATABASE: ${DB_NAME:-cyberguardian}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cyberguardian_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-cyberguardian}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cyberguardian_mysql:
